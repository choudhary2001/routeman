[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "routeman"
dynamic = ["version"]
description = "Convert your Django, Django REST framework (DRF), Flask or FastAPI API into a Postman collection with one command: every endpoint, request body, query parameter, auth and environment. No OpenAPI or Swagger needed."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shwastik Tech Solutions Pvt Ltd", email = "contact@swastik.ai" }]
maintainers = [{ name = "Shwastik Tech Solutions Pvt Ltd", email = "contact@swastik.ai" }]
keywords = [
    "postman", "postman-collection", "postman-environment", "api-to-postman", "convert-api-to-postman",
    "postman-generator", "postman-export", "django", "django-rest-framework", "drf", "flask", "fastapi",
    "rest-api", "api", "api-testing", "api-documentation", "openapi", "swagger", "newman", "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Documentation",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/choudhary2001/routeman"
Documentation = "https://github.com/choudhary2001/routeman#readme"
Repository = "https://github.com/choudhary2001/routeman"
Issues = "https://github.com/choudhary2001/routeman/issues"
Changelog = "https://github.com/choudhary2001/routeman/blob/main/CHANGELOG.md"
Company = "https://swastik.ai"

[project.scripts]
routeman = "routeman.cli:main"

[tool.hatch.version]
path = "src/routeman/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/routeman"]

[tool.hatch.build.targets.sdist]
include = ["/src/routeman", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]
exclude = ["**/__pycache__", "**/*.sqlite3", "**/postman", "**/routeman.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
