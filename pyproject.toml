[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "routeman"
dynamic = ["version"]
description = "Generate Postman collections from Django, Django REST framework, Flask and FastAPI projects - no OpenAPI or documentation library needed."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Swastik Tech Solutions Pvt Ltd", email = "contact@swastik.ai" }]
maintainers = [{ name = "Swastik Tech Solutions Pvt Ltd", email = "contact@swastik.ai" }]
keywords = ["postman", "postman-collection", "django", "django-rest-framework", "flask", "fastapi", "api", "cli", "api-testing", "openapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Documentation",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.urls]
Homepage = "https://swastik.ai"
Documentation = "https://pypi.org/project/routeman/"

[project.scripts]
routeman = "routeman.cli:main"

[tool.hatch.version]
path = "src/routeman/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/routeman"]

[tool.hatch.build.targets.sdist]
include = ["/src/routeman", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]
exclude = ["**/__pycache__", "**/*.sqlite3", "**/postman", "**/routeman.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
